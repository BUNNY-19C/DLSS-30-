name: Release

# 推送 v* 标签时自动构建并发布，也可以在 Actions 页面手动触发。
#
# 产出两个文件：
#   · DLSSGManager.exe        —— 单文件绿色版，双击即用
#   · DLSSGManager-*-setup.exe —— 安装包，安装路径可选，带卸载程序
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 构建并测试
        shell: pwsh
        run: |
          dotnet build -c Release --nologo

          # 未获取 Mod 文件时，依赖它们的用例会自动跳过；其余用例必须全绿。
          # 用 & 调用以免路径含空格时被当成字符串。
          & ./test/Harness/bin/Release/net8.0-windows/Harness.exe
          if ($LASTEXITCODE -ne 0) { throw "测试失败（退出码 $LASTEXITCODE）" }

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          # 标签形如 v1.2.3 时取版本号；手动触发则用 csproj 里的值。
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = '0.0.0-dev'
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Output "版本: $v"

      - name: 发布绿色版 exe
        shell: pwsh
        run: |
          # 自包含：目标机器无需安装 .NET 运行时，双击即可用。
          dotnet publish src/DLSSGManager/DLSSGManager.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=${{ steps.version.outputs.value }} `
            -o publish --nologo

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          # runner 自带 Chocolatey，装 Inno Setup 6 用于编译安装包。
          choco install innosetup --yes --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC.exe：$iscc" }
          Write-Output "ISCC: $iscc"

      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "installer/setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "安装包编译失败（退出码 $LASTEXITCODE）" }

      - name: 生成校验值
        shell: pwsh
        run: |
          $files = @(
            'publish/DLSSGManager.exe',
            (Get-Item 'dist/DLSSGManager-*-setup.exe' | Select-Object -First 1).FullName
          )

          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash
            "{0}  {1}" -f $hash, (Split-Path $f -Leaf)
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt

          Get-Content dist/SHA256SUMS.txt
          foreach ($f in $files) {
            "{0}: {1:N1} MB" -f (Split-Path $f -Leaf), ((Get-Item $f).Length / 1MB) | Write-Output
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DLSSGManager-${{ steps.version.outputs.value }}
          path: |
            publish/DLSSGManager.exe
            dist/DLSSGManager-*-setup.exe
            dist/SHA256SUMS.txt

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/DLSSGManager.exe
            dist/DLSSGManager-*-setup.exe
            dist/SHA256SUMS.txt
          body: |
            ## 两种用法，任选其一

            | 文件 | 说明 |
            |---|---|
            | `DLSSGManager-*-setup.exe` | **安装包**。安装路径可选，带卸载程序，会创建开始菜单项 |
            | `DLSSGManager.exe` | **绿色版**。单文件，放到任意目录双击即可 |

            两者都不需要安装 .NET 运行时。

            ## 安装包

            运行后按向导选择安装路径（默认 `C:\Program Files\DLSSG Manager`，可改到任意位置）。

            安装目录只放程序本体。Mod 文件（约 75 MB）在首次启动时下载，位置取决于安装路径：

            - 装在可写目录（如 D 盘或用户目录）→ 放在程序的 `mod\` 子目录
            - 装在 `C:\Program Files` 等受保护目录 → 自动放到 `%APPDATA%\DLSSGManager\mod`

            卸载时只删除程序本体，会单独询问是否一并清除游戏列表、备份和 Mod 文件。

            ## 使用

            1. 首次启动会提示获取 Mod 文件（约 75 MB），选「是」。
            2. 点「扫描 Steam 库」或「添加游戏…」，选中游戏，点「部署到该游戏」。

            要撤销就点「一键恢复」。程序只删除经签名和哈希确认属于本项目的文件。

            ## 注意

            - **带内核级反作弊的游戏不能用**（会让 Mod 失效并有账号风险）。程序会自动检测并禁止部署。
              已确认的例子：绝区零（米哈游 HoYoKProtect）、战争雷霆（BattlEye）、终末地（腾讯 ACE）、
              守望先锋（网易 NEAC）。
            - 需要 RTX 30 系（SM86）。RTX 20 系可改用 SM75 路由；RTX 40/50 系原生支持帧生成，不需要本工具。
            - 杀软可能误报——这类 DLL 代理行为容易被启发式检测盯上。
            - 本程序只是 dlssg_for_sm86 的部署工具，不含也不修改 Mod 本身。

            ## 校验

            下载后可核对 `SHA256SUMS.txt`：

            ```powershell
            Get-FileHash DLSSGManager.exe -Algorithm SHA256
            ```
